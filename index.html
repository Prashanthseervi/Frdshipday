<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mithli's Friendship Adventure ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->

<div id="intro">

<h1>❤️ Friendship Adventure ❤️</h1>

<h2>From</h2>

<h3>Prashanth ❤️ Riddhi</h3>

<p>

A little surprise made especially for

our best friend

<b>Mithli</b>

</p>

<button id="startBtn">

Start Adventure 🎮

</button>

</div>

<!-- GAME -->

<div id="game" style="display:none;">

<div id="hud">
  <div id="messageBox"></div>

❤️ Hearts :

<span id="score">0</span>/10

</div>

<div id="world">
  <div class="cloud" style="top:60px;left:100px;">☁️</div>
<div class="cloud" style="top:120px;left:900px;">☁️</div>
<div class="cloud" style="top:80px;left:1800px;">☁️</div>

<div class="tree" style="left:350px;">🌳</div>
<div class="tree" style="left:850px;">🌳</div>
<div class="tree" style="left:1450px;">🌳</div>
<div class="tree" style="left:2200px;">🌳</div>
<div class="tree" style="left:3200px;">🌳</div>
<div class="tree" style="left:4100px;">🌳</div>

<div class="flower" style="left:250px;">🌸</div>
<div class="flower" style="left:700px;">🌼</div>
<div class="flower" style="left:1200px;">🌺</div>
<div class="flower" style="left:2100px;">🌻</div>
<div class="flower" style="left:3000px;">🌷</div>
<div class="flower" style="left:3900px;">🌹</div>
<img id="player" src="roblox-character.Png" alt="Player">

<div class="heart" style="left:500px;"></div>

<div class="heart" style="left:900px;"></div>

<div class="heart" style="left:1300px;"></div>

<div class="heart" style="left:1700px;"></div>

<div class="heart" style="left:2100px;"></div>

<div class="heart" style="left:2500px;"></div>

<div class="heart" style="left:2900px;"></div>

<div class="heart" style="left:3300px;"></div>

<div class="heart" style="left:3700px;"></div>

<div class="heart" style="left:4100px;"></div>

<div id="gift">

🎁

</div>

<div id="cake">

🎂
<div class="balloon" style="left:4300px;">🎈</div>
<div class="balloon" style="left:4400px;">🎈</div>
<div class="balloon" style="left:4500px;">🎈</div>
<div class="balloon" style="left:4600px;">🎈</div>
</div>

</div>
<div id="controls">

    <button id="left">⬅️</button>

    <button id="jump">⬆️</button>

    <button id="right">➡️</button>

</div>

</div>

<!-- VIDEO -->

<div id="videoBox">

<video id="surpriseVideo" controls>

<source src="video.MP4" type="video/MP4">

</video>

</div>

<script src="game.js"></script>
  
<audio id="bgMusic" loop>
    <source src="friendship.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">🎵</button>

</body>

</html>
